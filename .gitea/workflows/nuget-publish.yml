name: Publish to NuGet

on:
  push:
    branches: [ "main" ]
    tags: [ 'v[0-9]*.[0-9]*.[0-9]*' ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: parham/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      run: dotnet test --no-build --configuration Release

    - name: Package
      run: dotnet pack --no-build --configuration Release --output nupkgs

    - name: Publish to NuGet
      run: |
        for f in nupkgs/*.nupkg; do
          [ -e "$f" ] || continue
          dotnet nuget push "$f" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        done